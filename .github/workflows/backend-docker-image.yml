name: Deploy Backend

on:
  push:
    branches: ["main"]
    paths:
      - "backend/**"

jobs:
  build-and-deploy:

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4


      # Login to DockerHub
      - name: Login to DockerHub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}


      # Build Docker image
      - name: Build Docker image
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/task-api ./backend


      # Push image
      - name: Push Docker image
        run: docker push ${{ secrets.DOCKER_USERNAME }}/task-api


      # Deploy to EC2
      - name: Deploy to EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            docker pull ${{ secrets.DOCKER_USERNAME }}/task-api
            docker stop task-api || true
            docker rm task-api || true
            docker run -d -p 5000:5000 --name task-api --restart always ${{ secrets.DOCKER_USERNAME }}/task-api
