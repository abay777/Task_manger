name: Deploy Backend

on:
  push:
    branches: ["main"]
    paths:
      - "Backend/**"

env:
  IMAGE_NAME: ${{ secrets.DOCKER_USERNAME }}/task-api

jobs:
  build-and-deploy:
    name: Build, Push & Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # -----------------------------
      # Debug secrets (masked in logs)
      # -----------------------------
      - name: Debug secrets
        run: |
          echo "Docker username: ${{ secrets.DOCKER_USERNAME }}"
          echo "Docker password present: ${{ secrets.DOCKER_PASSWORD != '' }}"
          echo "EC2 host: ${{ secrets.EC2_HOST }}"
          echo "EC2 key present: ${{ secrets.EC2_SSH_KEY != '' }}"
          echo "Image name will be: $IMAGE_NAME:latest"

      # -----------------------------
      # Login to DockerHub
      # -----------------------------
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # -----------------------------
      # Build Docker image
      # -----------------------------
      - name: Build Docker image
        working-directory: Backend
        run: |
          echo "Building Docker image..."
          docker build -t $IMAGE_NAME:latest .

      # -----------------------------
      # Push image to DockerHub
      # -----------------------------
      - name: Push Docker image
        run: |
          echo "Pushing Docker image..."
          docker push $IMAGE_NAME:latest

      # -----------------------------
      # Deploy to EC2
      # -----------------------------
      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            echo "Pulling latest Docker image..."
            docker pull $IMAGE_NAME:latest

            echo "Stopping old container if exists..."
            docker stop task-api || true
            docker rm task-api || true

            echo "Starting new container..."
            docker run -d \
              -p 5000:5000 \
              --name task-api \
              --restart always \
              $IMAGE_NAME:latest

            echo "Cleaning unused Docker images..."
            docker system prune -f

            echo "Deployment completed."